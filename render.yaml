services:
  # -------------------------------------------------------------
  # Backend: FastAPI Python Service
  # -------------------------------------------------------------
  - type: web
    name: visioninspect-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PROJECT_NAME
        value: "VisionInspect AI"
      - key: API_VERSION
        value: "1.0.0"
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: "visioninspect_db"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: USE_REAL_AI
        value: "True"
      - key: CORS_ORIGINS
        value: '["*"]'

  # -------------------------------------------------------------
  # Frontend: Next.js Service
  # -------------------------------------------------------------
  - type: web
    name: visioninspect-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install --legacy-peer-deps && npm run build"
    startCommand: "npm run start -- -p $PORT"
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: visioninspect-backend
          property: host
