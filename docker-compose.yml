services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: visioninspect-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://localhost:8000/api
    container_name: visioninspect-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
