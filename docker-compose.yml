version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=visioninspect_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend-fastapi
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - PORT=8000
      - JWT_SECRET=change_this_to_a_long_random_secret_in_production
      - JWT_EXPIRES_MINUTES=480
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/visioninspect_db
    ports:
      - "8000:8000"
    volumes:
      - ./backend-fastapi/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata: