<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#153e42" />
      <stop offset="100%" stop-color="#0b2225" />
    </linearGradient>
    <linearGradient id="logoBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="1" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.2" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#logoBgGrad)" stroke="#1e545a" stroke-width="1.5" />

  <!-- Target Viewfinder Corners (Teal/Cyan) -->
  <path d="M 14 24 L 14 16 A 2 2 0 0 1 16 14 L 24 14" fill="none" stroke="#2dd4bf" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 40 14 L 48 14 A 2 2 0 0 1 50 16 L 50 24" fill="none" stroke="#2dd4bf" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 14 40 L 14 48 A 2 2 0 0 0 16 50 L 24 50" fill="none" stroke="#2dd4bf" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 40 50 L 48 50 A 2 2 0 0 0 50 48 L 50 40" fill="none" stroke="#2dd4bf" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Laser Scan Beam -->
  <line x1="12" y1="32" x2="52" y2="32" stroke="url(#logoBeamGrad)" stroke-width="3" stroke-linecap="round" filter="url(#logoGlow)" />

  <!-- AI Focus Core Reticle -->
  <circle cx="32" cy="32" r="6" fill="#153e42" stroke="#2dd4bf" stroke-width="2" />
  <circle cx="32" cy="32" r="2.5" fill="#f43f5e" />
</svg>
