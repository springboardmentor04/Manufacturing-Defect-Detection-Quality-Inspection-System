<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | VisionInspect AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <main class="auth-card">
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px">
                <div class="logo-icon">◈</div>
                <h1 style="font-size:24px; font-weight:800; color:var(--text-primary)">VisionInspect <span style="color:var(--cyan)">AI</span></h1>
            </div>
            <p style="color:var(--text-secondary); font-size:14px; margin-bottom:28px">AI-Powered Manufacturing Defect Detection & Quality Control</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input id="email" type="email" placeholder="qe@visioninspect.ai" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="••••••••" required>
                </div>

                <button class="btn btn-primary" style="width:100%; margin-top:8px" type="submit">
                    Sign In to Portal →
                </button>

                <p id="msg" style="margin-top:14px; font-size:13px; color:var(--rose); font-weight:600; text-align:center"></p>
            </form>

            <div style="margin-top:28px; padding-top:20px; border-top:1px solid var(--border-color)">
                <p style="font-size:12px; font-weight:700; uppercase; color:var(--text-muted); letter-spacing:0.5px; text-align:center; margin-bottom:12px">
                    ⚡ DEMO QUICK ACCESS ROLES
                </p>
                <button class="demo-shortcut-btn" onclick="demoLogin('qe@visioninspect.ai', 'password123')">
                    <span style="color:var(--cyan)">🛠️</span> Sign in as Quality Engineer (QE)
                </button>
                <button class="demo-shortcut-btn" onclick="demoLogin('pm@visioninspect.ai', 'password123')">
                    <span style="color:#c084fc">📊</span> Sign in as Product Manager (PM)
                </button>
            </div>

            <p style="color:var(--text-muted); font-size:13px; text-align:center; margin-top:24px">
                New industrial account? <a href="register.html" style="color:var(--cyan); font-weight:600; text-decoration:none">Register Now</a>
            </p>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
